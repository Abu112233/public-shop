<!DOCTYPE html>
<html lang="uz"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UC Do'kon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0f0c;--card:#141a16;--line:#25302a;--g:#6dff9e;--t:#fff;--m:#8a968f}
*{box-sizing:border-box}
body{margin:0;padding:16px 16px 110px;background:var(--bg);color:var(--t);font-family:system-ui,sans-serif}
h1{font-size:18px;font-style:italic;letter-spacing:.5px}
h2{font-size:16px;margin:22px 0 10px}
input{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--t);font-size:16px}
.hint{color:var(--m);font-size:13px;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pack{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer}
.pack.sel{border-color:var(--g);box-shadow:0 0 0 1px var(--g)}
.uc{font-size:24px;font-weight:800;font-style:italic}
.bonus{color:var(--g);font-size:13px;min-height:16px}
.price{margin-top:10px;color:var(--m)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:12px;align-items:center}
.bar div{flex:1;font-size:13px;color:var(--m)}.bar b{color:var(--t);font-size:16px;display:block}
button{flex:1.4;padding:14px;border:0;border-radius:14px;background:var(--g);color:#04210f;font-weight:800;font-size:15px;opacity:.4}
button.on{opacity:1}
</style></head><body>
<h1>PUBG MOBILE UC TOP-UP</h1>
<h2>1. Hisob ma'lumotlari</h2>
<input id="pid" inputmode="numeric" maxlength="12" placeholder="Masalan: 5123456789">
<div class="hint">O'yin ichidagi Profil bo'limidan ID'ni kiriting. Faqat Global server.</div>
<h2>2. Paketni tanlang</h2>
<div class="grid" id="grid"></div>
<div class="bar"><div>TANLANGAN<b id="sum">—</b></div><button id="go">DAVOM ETISH →</button></div>
<script>
// Narxlar bot.py dagi PACKS bilan bir xil bo'lsin!
const PACKS=[{uc:60,bonus:0,price:13000},{uc:325,bonus:0,price:61000},{uc:660,bonus:0,price:120000}];
const tg=Telegram.WebApp;tg.ready();tg.expand();
let sel=null;
const f=n=>n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const grid=document.getElementById('grid'),pid=document.getElementById('pid'),go=document.getElementById('go');
PACKS.forEach(p=>{const d=document.createElement('div');d.className='pack';
d.innerHTML=`<div class="uc">${p.uc} <small>UC</small></div><div class="bonus">${p.bonus?'+'+p.bonus+' bonus':''}</div><div class="price">${f(p.price)} so'm</div>`;
d.onclick=()=>{sel=p;[...grid.children].forEach(x=>x.classList.remove('sel'));d.classList.add('sel');upd()};grid.appendChild(d)});
function upd(){document.getElementById('sum').textContent=sel?`${sel.uc} UC · ${f(sel.price)} so'm`:'—';
go.classList.toggle('on',!!sel&&/^\d{5,12}$/.test(pid.value))}
pid.oninput=()=>{pid.value=pid.value.replace(/\D/g,'');upd()};
go.onclick=()=>{if(!go.classList.contains('on'))return;tg.sendData(JSON.stringify({uc:sel.uc,pid:pid.value}))};
</script></body></html>
